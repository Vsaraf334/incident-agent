[project]
name = "incident-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.12.0",
    "langchain-anthropic>=1.7.12",
    "langgraph>=1.2.24",
    "pydantic>=2.14.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff.lint.isort]
# our own modules (src/ and evals/ are on sys.path, not installed packages)
known-first-party = ["agent", "graph_agent", "tools", "grading", "judge"]
